[project]
name = "djnago-restfull"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "luisOrtga", email = "ortegaluiskb@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.1",
    "djangorestframework>=3.18.0",
]

[project.scripts]
djnago-restfull = "djnago_restfull:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "single"
